<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cards Consensus Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23FFD21F'/%3E%3Ctext x='90' y='128' text-anchor='middle' font-family='Arial,sans-serif' font-size='112' font-weight='900' fill='%2307111F'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23FFD21F'/%3E%3Ctext x='90' y='128' text-anchor='middle' font-family='Arial,sans-serif' font-size='112' font-weight='900' fill='%2307111F'%3EB%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:720px;margin:auto;padding:18px 14px 90px}.v,.sub,.muted,label{color:#9eacc0}.v{font-size:12px}h1{font-size:25px;margin:8px 0}
.box,.card{background:#101d30;border:1px solid #26364d;border-radius:18px;padding:14px;margin:12px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;margin:9px 0 5px}
input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #26364d;background:#0a1525;color:#f4f7fb;font-size:16px}
button{font-weight:800}.add{margin-top:14px;background:#ffd34d;color:#111;border:0}.tabs{display:flex;gap:8px;margin:16px 0}.active{background:#e8edf5;color:#111}
.market{border-top:1px solid #26364d;padding-top:12px;margin-top:12px}.market:first-child{border-top:0;margin-top:0;padding-top:0}
.mtitle{font-weight:900;font-size:16px}.badge{display:inline-block;background:#1c2b40;padding:5px 8px;border-radius:9px;font-weight:900;margin:6px 0}
.hot{background:#674d00;color:#ffe28a}.OVER{color:#49db8c;font-weight:900}.UNDER{color:#ff9b9b;font-weight:900}.PASS{color:#9eacc0;font-weight:900}
.votes{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.del{grid-column:1/-1;background:#51282d}
.ok{color:#6ee7a8;font-weight:900}.bad{color:#ff8b8b;font-weight:900}.empty{text-align:center;color:#9eacc0;padding:30px 5px}
.stats{margin-top:10px}.statrow{display:flex;justify-content:space-between;border-top:1px solid #26364d;padding:7px 0}
</style>
</head>
<body><div class="w">
<div class="v">v1.1 🟨📡</div><h1>📡 FINAL Consensus Radar</h1>
<div class="sub">1X2 • Cards O/U 2.5 • Corners O/U 9.5 • PASS არ ითვლება</div>

<div class="box"><b>📡 ნამდვილი 3/3+ რადარი</b><div id="radarText" class="muted" style="margin:7px 0">კონსენსუსებს ველოდებით.</div>
<button id="notifyBtn" onclick="enableNotifications()">🔔 შეტყობინებების ჩართვა</button></div>

<div class="box">
<div class="g"><div><label>მასპინძელი</label><input id="h"></div><div><label>სტუმარი</label><input id="a"></div></div>
<label>თარიღი</label><input id="date" type="date">
<div id="forms"></div>
<button class="add" onclick="addMatch()">+ მატჩის დამატება</button>
</div>

<div class="tabs"><button id="t" class="active" onclick="setTab('today')">დღეს / მომავალი</button><button id="hist" onclick="setTab('history')">ისტორია</button></div>
<div id="list"></div>
</div>

<script>
const STORE="final_consensus_radar_v1";
const MARKETS=[
 {id:"result",title:"⚽ 1X2",line:"1 / X / 2",choices:["PASS","1","X","2"]},
 {id:"cards",title:"🟨 მატჩის ბარათები",line:"2.5",choices:["PASS","OVER","UNDER"]},
 {id:"corners",title:"⛳ მატჩის კუთხურები",line:"9.5",choices:["PASS","OVER","UNDER"]}
];
const SOURCES=["Source A","Source B","Source C","Source D","Source E"];
let tab="today"; const q=x=>document.getElementById(x);
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function save(x){localStorage.setItem(STORE,JSON.stringify(x))}
function opts(m){return m.choices.map(x=>`<option>${x}</option>`).join("")}
q("forms").innerHTML=MARKETS.map(m=>`<div class="market"><div class="mtitle">${m.title} — ${m.line}</div><div class="muted">ერთი ხაზი • PASS ხმაში არ ითვლება</div>${SOURCES.map((s,i)=>`<label>წყარო ${i+1}</label><input id="${m.id}_name_${i}" placeholder="მაგ. Road2Sushi"><select id="${m.id}_${i}">${opts(m)}</select>`).join("")}</div>`).join("");
function getVotes(id){return SOURCES.map((_,i)=>q(`${id}_${i}`).value)}
function getNames(id){return SOURCES.map((_,i)=>q(`${id}_name_${i}`).value.trim()||`წყარო ${i+1}`)}
function calc(v){let active=v.filter(x=>x!=="PASS"); if(active.length<2)return {pick:"—",pat:`არასაკმარისი მონაცემი (${active.length} ხმა)`,hot:false,n:active.length}; let c={};active.forEach(x=>c[x]=(c[x]||0)+1);let a=Object.entries(c).sort((x,y)=>y[1]-x[1]);let top=a[0], tie=a[1]&&a[1][1]===top[1];return {pick:tie?"—":top[0],pat:tie?"კონსენსუსი არაა":`${top[1]}/${active.length} ${top[0]}`,hot:!tie&&top[1]===active.length&&active.length>=3,n:active.length}}
function addMatch(){let h=q("h").value.trim(),a=q("a").value.trim(),date=q("date").value;if(!h||!a||!date){alert("შეავსე გუნდები და თარიღი");return}let markets={};MARKETS.forEach(m=>markets[m.id]={votes:getVotes(m.id),names:getNames(m.id),calc:calc(getVotes(m.id)),title:m.title,line:m.line});let x=load();x.unshift({id:Date.now(),h,a,date,markets});save(x);render();}
function setTab(x){tab=x;q("t").classList.toggle("active",x==="today");q("hist").classList.toggle("active",x==="history");render()}
function del(id){save(load().filter(x=>x.id!==id));render()}
function render(){let now=new Date().toISOString().slice(0,10),x=load().filter(r=>tab==="today"?r.date>=now:r.date<now);let hot=[];x.forEach(r=>Object.values(r.markets).forEach(m=>{if(m.calc.hot)hot.push(`${r.h}–${r.a}: ${m.title} ${m.calc.pat}`)}));q("radarText").innerHTML=hot.length?hot.map(x=>`🔥 ${x}`).join("<br>"):"ჯერ ნამდვილი 3/3+ კონსენსუსი არ გვაქვს.";q("list").innerHTML=x.map(r=>`<div class="box"><b>${r.h} – ${r.a}</b><div class="muted">${r.date}</div>${Object.values(r.markets).map(m=>`<div class="market"><b>${m.title} — ${m.line}</b><div>${m.calc.hot?"🔥 ":""}${m.calc.pat}</div><div class="muted">${m.names.map((n,i)=>`${n}: ${m.votes[i]}`).join(" • ")}</div></div>`).join("")}<button onclick="del(${r.id})">წაშლა</button></div>`).join("")||'<div class="box muted">მატჩები ჯერ არაა დამატებული.</div>'}
async function enableNotifications(){alert("რადარი მზადაა. ძლიერი სიგნალი ეკრანზე 🔥 ნიშნით გამოჩნდება.")}
q("date").value=new Date().toISOString().slice(0,10);render();
</script></body></html>
