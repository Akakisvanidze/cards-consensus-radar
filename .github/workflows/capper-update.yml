name: Capper Float Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: capper-float-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and validate public Capper data
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from urllib.parse import urlencode
          from zoneinfo import ZoneInfo

          zone = ZoneInfo('Asia/Tbilisi')
          today = datetime.now(zone).date()
          markets = ['total_goals', 'match_winner', 'double_chance', 'btts', 'corners']
          base = Path('data/capper')
          base.mkdir(parents=True, exist_ok=True)
          available = []
          failures = []
          for day in (today, today + timedelta(days=1)):
              date = day.isoformat()
              for market in markets:
                  url = 'https://capper.win/api/v2/list?' + urlencode({'date': date, 'market': market})
                  request = urllib.request.Request(url, headers={'User-Agent': 'FootballFloat/1.2 (GitHub Actions)', 'Accept': 'application/json'})
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          body = response.read(2_000_001)
                          if len(body) > 2_000_000:
                              raise RuntimeError('Response is too large')
                      data = json.loads(body)
                      if not isinstance(data, dict) or not isinstance(data.get('countries'), list):
                          raise ValueError('Expected countries array missing')
                      # Never overwrite the latest successful file with a bad response.
                      filename = f'{date}_{market}.json'
                      (base / filename).write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
                      available.append({'date': date, 'market': market, 'file': filename})
                      print(f'OK {date} {market}: {len(body)} bytes')
                  except Exception as exc:
                      print(f'Unavailable {date} {market}: {type(exc).__name__}: {exc}')
                      failures.append({'date': date, 'market': market, 'error': type(exc).__name__})
                  time.sleep(0.7)
          if not available:
              raise RuntimeError('No valid API responses; keeping previously published data unchanged')
          manifest = {
              'updated_at': datetime.now(ZoneInfo('UTC')).isoformat(),
              'timezone': 'Asia/Tbilisi',
              'available': available,
              'unavailable': failures,
              'note': 'Single-source published selections, not verified probabilities or GREEN.'
          }
          (base / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Save public JSON files to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/capper
          if git diff --cached --quiet; then
            echo 'No new data'
          else
            git commit -m 'Update Capper Float public data'
            git push
          fi
