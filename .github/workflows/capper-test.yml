name: Capper API Test

on:
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Download and save Capper JSON
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          url = f'https://capper.win/api/v2/list?date={today}&market=total_goals'
          request = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/json'
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()
              print('HTTP status:', response.status)
              print('Response size:', len(data), 'bytes')

          parsed = json.loads(data)
          os.makedirs('data', exist_ok=True)
          with open('data/capper-latest.json', 'w', encoding='utf-8') as file:
              json.dump(parsed, file, ensure_ascii=False, indent=2)

          print('JSON file saved successfully')
          PY

      - name: Upload JSON test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capper-json-test
          path: data/capper-latest.json
          retention-days: 7
