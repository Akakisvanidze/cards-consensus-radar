<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cards Consensus Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23FFD21F'/%3E%3Ctext x='90' y='128' text-anchor='middle' font-family='Arial,sans-serif' font-size='112' font-weight='900' fill='%2307111F'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23FFD21F'/%3E%3Ctext x='90' y='128' text-anchor='middle' font-family='Arial,sans-serif' font-size='112' font-weight='900' fill='%2307111F'%3EB%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:720px;margin:auto;padding:18px 14px 90px}.v,.sub,.muted,label{color:#9eacc0}.v{font-size:12px}h1{font-size:25px;margin:8px 0}
.box,.card{background:#101d30;border:1px solid #26364d;border-radius:18px;padding:14px;margin:12px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;margin:9px 0 5px}
input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #26364d;background:#0a1525;color:#f4f7fb;font-size:16px}
button{font-weight:800}.add{margin-top:14px;background:#ffd34d;color:#111;border:0}.tabs{display:flex;gap:8px;margin:16px 0}.active{background:#e8edf5;color:#111}
.market{border-top:1px solid #26364d;padding-top:12px;margin-top:12px}.market:first-child{border-top:0;margin-top:0;padding-top:0}
.mtitle{font-weight:900;font-size:16px}.badge{display:inline-block;background:#1c2b40;padding:5px 8px;border-radius:9px;font-weight:900;margin:6px 0}
.hot{background:#674d00;color:#ffe28a}.OVER{color:#49db8c;font-weight:900}.UNDER{color:#ff9b9b;font-weight:900}.PASS{color:#9eacc0;font-weight:900}
.votes{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.del{grid-column:1/-1;background:#51282d}
.ok{color:#6ee7a8;font-weight:900}.bad{color:#ff8b8b;font-weight:900}.empty{text-align:center;color:#9eacc0;padding:30px 5px}
.stats{margin-top:10px}.statrow{display:flex;justify-content:space-between;border-top:1px solid #26364d;padding:7px 0}
</style>
</head>
<body><div class="w">
<div class="v">v1.1 🟨📡</div><h1>🟨 Cards Consensus Lab</h1>
<div class="sub">3 ცალკე ბაზარი • 3 ერთხაზიანი წყარო • OVER / UNDER / PASS</div>

<div class="box"><b>📡 რეალური 3/3 რადარი</b><div id="radarText" class="muted" style="margin:7px 0">კონსენსუსებს ველოდებით.</div>
<button id="notifyBtn" onclick="enableNotifications()">🔔 შეტყობინებების ჩართვა</button></div>

<div class="box">
<div class="g"><div><label>მასპინძელი</label><input id="h"></div><div><label>სტუმარი</label><input id="a"></div></div>
<label>თარიღი</label><input id="date" type="date">
<div id="forms"></div>
<button class="add" onclick="addMatch()">+ მატჩის დამატება</button>
</div>

<div class="tabs"><button id="t" class="active" onclick="setTab('today')">დღეს / მომავალი</button><button id="hist" onclick="setTab('history')">ისტორია</button></div>
<div id="list"></div>
</div>

<script>
const STORE="cards_lab_final_v20";
const NOTIFY="cards_notify_final_v20";
const SOURCES=["Road2Sushi","SportsKing","StatCheck"];
const MARKETS=[
 {id:"total",title:"🟨 მატჩის საერთო ბარათები",line:"2.5",over:"OVER 2.5",under:"UNDER 2.5"},
 {id:"home",title:"🏠 მასპინძლის ბარათები",line:"0.5",over:"OVER 0.5",under:"UNDER 0.5"},
 {id:"away",title:"✈️ სტუმრის ბარათები",line:"0.5",over:"OVER 0.5",under:"UNDER 0.5"}
];
let tab="today"; const q=x=>document.getElementById(x);
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function save(x){localStorage.setItem(STORE,JSON.stringify(x))}
function opts(){return '<option>PASS</option><option>OVER</option><option>UNDER</option>'}
q("forms").innerHTML=MARKETS.map(m=>`<div class="market"><div class="mtitle">${m.title} — ${m.line}</div>${SOURCES.map((s,i)=>`<label>${s}</label><select id="${m.id}_${i}">${opts()}</select>`).join("")}</div>`).join("");

function calc(v){
 let o=v.filter(x=>x==="OVER").length,u=v.filter(x=>x==="UNDER").length,p=v.filter(x=>x==="PASS").length;
 let pick=o>u?"OVER":u>o?"UNDER":"—",hi=Math.max(o,u),lo=Math.min(o,u);
 let valid=o+u;
 let pat = valid<2 ? "არასაკმარისი მონაცემი" : (pick==="—" ? "კონსენსუსი არაა" : `${hi}/${valid}${p?` (${p} PASS)`:""}`);
 return {o,u,p,pick,pat,hot:p===0&&hi===3};
}
function getVotes(id){return SOURCES.map((_,i)=>q(`${id}_${i}`).value)}
async function enableNotifications(){
 if(!("Notification" in window)){alert("ამ მოწყობილობაზე შეტყობინებები ვერ ჩაირთო.");return}
 let p=Notification.permission;if(p!=="granted")p=await Notification.requestPermission();
 if(p==="granted"){localStorage.setItem(NOTIFY,"1");q("notifyBtn").textContent="🔔 შეტყობინებები ჩართულია";try{new Notification("Cards Consensus Lab",{body:"შეტყობინებები ჩართულია."})}catch(e){}}
}
function notifyHot(m){
 if(localStorage.getItem(NOTIFY)!=="1"||!("Notification" in window)||Notification.permission!=="granted")return;
 MARKETS.forEach(x=>{let c=calc(m.markets[x.id].v);if(!c.hot)return;let k=`cards_notified_${m.id}_${x.id}_${m.markets[x.id].v.join("_")}`;if(localStorage.getItem(k))return;
 try{new Notification(`${c.pat} კონსენსუსი`,{body:`${m.h} – ${m.a} • ${x.title} → ${c.pick} ${x.line}`})}catch(e){}
 localStorage.setItem(k,"1")})
}
function addMatch(){
 let H=q("h").value.trim(),A=q("a").value.trim(),D=q("date").value;if(!H||!A||!D)return alert("შეავსე გუნდები და თარიღი.");
 let markets={};MARKETS.forEach(x=>markets[x.id]={v:getVotes(x.id),final:null,result:null});
 let m={id:Date.now(),h:H,a:A,date:D,markets};let d=load();d.unshift(m);save(d);notifyHot(m);
 q("h").value=q("a").value="";MARKETS.forEach(x=>SOURCES.forEach((_,i)=>q(`${x.id}_${i}`).value="PASS"));render()
}
function actual(market,n){if(market==="total")return n>=4?"OVER":"UNDER";return n>=1?"OVER":"UNDER"}
function finalMarket(id,mid){
 let d=load(),m=d.find(x=>x.id===id),mm=m.markets[mid],def=mm.final===null?"":mm.final;
 let n=prompt(mid==="total"?"სულ რამდენი ბარათი იყო მატჩში?":"რამდენი ბარათი მიიღო გუნდმა?",def);if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<0)return alert("შეიყვანე ბარათების რაოდენობა.");
 mm.final=n;mm.result=actual(mid,n);save(d);render()
}
function del(id){if(confirm("წავშალოთ მატჩი?")){save(load().filter(x=>x.id!==id));render()}}
function setTab(x){tab=x;render()}
function updateRadar(){
 let found=[];load().filter(m=>MARKETS.some(x=>m.markets[x.id].final===null)).forEach(m=>MARKETS.forEach(x=>{let c=calc(m.markets[x.id].v);if(c.hot&&m.markets[x.id].final===null)found.push({m,x,c})}));
 if(found.length){let z=found[0];q("radarText").innerHTML=`🔴 <b>${z.c.pat}</b> — ${z.m.h} – ${z.m.a}<br>${z.x.title} → <b>${z.c.pick} ${z.x.line}</b>`}
 else q("radarText").textContent="🟢 ახალი 4–1 ან 5–0 ჯერ არ არის.";
}
function stats(){
 let rows=[];MARKETS.forEach(x=>{let n=0,w=0;load().forEach(m=>{let mm=m.markets[x.id],c=calc(mm.v);if(mm.final!==null&&c.pick!=="—"){n++;if(c.pick===mm.result)w++}});rows.push(`<div class="statrow"><span>${x.title}</span><b>${w}/${n}${n?` • ${Math.round(w*100/n)}%`:""}</b></div>`)});
 return `<div class="box stats"><b>📊 ბაზრების შედეგები</b>${rows.join("")}</div>`
}
function render(){
 updateRadar();q("t").classList.toggle("active",tab==="today");q("hist").classList.toggle("active",tab==="history");
 let d=load().filter(m=>tab==="history"?MARKETS.some(x=>m.markets[x.id].final!==null):MARKETS.some(x=>m.markets[x.id].final===null));
 let head=tab==="history"?stats():"";
 if(!d.length){q("list").innerHTML=head+`<div class="empty">${tab==="history"?"ისტორია ჯერ ცარიელია":"მატჩები ჯერ არ არის დამატებული"}</div>`;return}
 q("list").innerHTML=head+d.map(m=>`<div class="card"><b style="font-size:18px">${m.h} – ${m.a}</b><div class="muted">${m.date}</div>
 ${MARKETS.map(x=>{let mm=m.markets[x.id],c=calc(mm.v),status=mm.final!==null?(c.pick==="—"?"⚪ კონსენსუსი არ იყო":c.pick===mm.result?'<span class="ok">✅ სწორი</span>':'<span class="bad">❌ არასწორი</span>'):"";
 return `<div class="market"><div class="mtitle">${x.title} — ${x.line}</div><div class="badge ${c.hot?"hot":""}">${c.pat}</div>
 <div>არჩევანი: <b class="${c.pick}">${c.pick}</b></div><div class="muted">OVER: ${c.o} • UNDER: ${c.u} • PASS: ${c.p}</div>
 <div class="votes">${SOURCES.map((s,i)=>`<span>${s}</span><b class="${mm.v[i]}">${mm.v[i]}</b>`).join("")}</div>
 <div style="margin-top:8px">FINAL: <b>${mm.final===null?"მოლოდინში":mm.final+" ბარათი"}</b>${status?" • "+status:""}</div>
 <button style="margin-top:8px" onclick="finalMarket(${m.id},'${x.id}')">${mm.final===null?"🏁 FINAL":"FINAL-ის შეცვლა"}</button></div>`}).join("")}
 <div class="actions"><button class="del" onclick="del(${m.id})">წაშლა</button></div></div>`).join("");
}
if(localStorage.getItem(NOTIFY)==="1"&&("Notification" in window)&&Notification.permission==="granted")q("notifyBtn").textContent="🔔 შეტყობინებები ჩართულია";
render();
</script></body></html>
